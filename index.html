<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<style>
  :root{
    --bg:#F9F6F1;--surface:#fff;--dark:#1A1A1A;--accent:#D4621A;--accent2:#8B6914;
    --text:#2D2D2D;--muted:#888;--radius:14px;--shadow:0 2px 16px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100vh}
  header{background:var(--dark);color:#fff;padding:28px 20px 20px;text-align:center;position:sticky;top:0;z-index:100}
  header h1{font-size:22px;letter-spacing:4px;font-weight:700;color:#fff}
  header p{font-size:10px;letter-spacing:3px;color:var(--accent);margin-top:2px;text-transform:uppercase}
  .search-wrap{padding:16px 16px 0;max-width:600px;margin:0 auto}
  .search-wrap input{width:100%;padding:11px 16px;border-radius:30px;border:1.5px solid #e0d8ce;background:#fff;font-size:14px;outline:none;color:var(--text);transition:.2s}
  .search-wrap input:focus{border-color:var(--accent)}
  .tabs-wrap{overflow-x:auto;padding:14px 16px 0;scrollbar-width:none;max-width:600px;margin:0 auto}
  .tabs-wrap::-webkit-scrollbar{display:none}
  .tabs{display:flex;gap:8px;width:max-content}
  .tab{padding:7px 16px;border-radius:20px;border:1.5px solid #ddd;background:#fff;font-size:13px;cursor:pointer;white-space:nowrap;transition:.2s;color:var(--text);font-weight:500}
  .tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
  main{max-width:600px;margin:0 auto;padding:18px 16px 100px}
  .section{margin-bottom:32px}
  .section-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid #e5ddd2}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;margin-bottom:12px;position:relative;transition:.2s}
  .card:hover{box-shadow:0 4px 24px rgba(0,0,0,.11);transform:translateY(-1px)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card-name{font-size:15px;font-weight:700;line-height:1.3;flex:1}
  .card-price{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap;margin-left:8px}
  .card-desc{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .tag{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:.3px}
  .tag.vegano{background:#e8f5e9;color:#2e7d32}
  .tag.vegetariano{background:#fff9e6;color:#b8860b}
  .tag.sintacc{background:#fce4ec;color:#880e4f}
  .badge{position:absolute;top:10px;left:10px;font-size:10px;padding:4px 10px;border-radius:20px;font-weight:700;letter-spacing:.5px;z-index:2}
  .badge.recomendado{background:rgba(212,98,26,.92);color:#fff}
  .badge.mas-vendido{background:rgba(26,26,26,.88);color:#fff}
  .card > .badge{top:-8px;left:auto;right:12px}
  .combo-card{background:var(--dark);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .combo-card .card-name{color:#fff;font-size:15px;font-weight:700}
  .combo-card .card-desc{color:#bbb;font-size:12.5px;margin-top:5px;line-height:1.5}
  .combo-card .card-price{font-size:15px;font-weight:700;color:var(--accent)}
  .combo-card .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .plato-dia{background:linear-gradient(135deg,var(--accent),#b85615);color:#fff;border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:24px;box-shadow:var(--shadow)}
  .plato-dia .label{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.8;margin-bottom:4px}
  .plato-dia h3{font-size:18px;font-weight:700}
  .plato-dia p{font-size:12px;opacity:.85;margin-top:4px}
  .no-results{text-align:center;padding:40px;color:var(--muted);font-size:14px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card,.combo-card{animation:fadeUp .3s ease}
</style>

const TAG_LABELS = { vegano:"🌿 Vegano", vegetariano:"🥗 Vegetariano", sintacc:"🚫G Sin TACC" };
const BADGE_LABELS = { "recomendado":"⭐ Recomendado", "mas-vendido":"🔥 Más vendido" };
let activeCategory = "all";

function formatPrice(p){ return p ? "$\u00a0"+p.toLocaleString("es-AR") : "Consultar" }

function buildTabs(){
  const tabs = document.getElementById("tabs");
  const all = document.createElement("button");
  all.className="tab active"; all.textContent="Todos"; all.dataset.id="all";
  all.onclick=()=>setTab("all"); tabs.appendChild(all);
  MENU.categorias.forEach(c=>{
    const b=document.createElement("button");
    b.className="tab"; b.textContent=c.nombre; b.dataset.id=c.id;
    b.onclick=()=>setTab(c.id); tabs.appendChild(b);
  });
}

function setTab(id){
  activeCategory=id;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.id===id));
  renderMenu();
}

function makeCard(it, isCombo){
  if(isCombo){
    const d=document.createElement("div"); d.className="combo-card";
    d.innerHTML=`<div class="card-top"><div class="card-name">${it.nombre}</div><div class="card-price">${formatPrice(it.precio)}</div></div>${it.desc?`<div class="card-desc">${it.desc}</div>`:""}`;
    return d;
  }
  const tagsHtml=(it.tags||[]).map(t=>`<span class="tag ${t}">${TAG_LABELS[t]||t}</span>`).join("");
  const badgeHtml=it.badge?`<div class="badge ${it.badge}">${BADGE_LABELS[it.badge]||it.badge}</div>`:"";
  const d=document.createElement("div"); d.className="card";
  d.innerHTML=`${badgeHtml}<div class="card-top"><div class="card-name">${it.nombre}</div><div class="card-price">${formatPrice(it.precio)}</div></div>${it.desc?`<div class="card-desc">${it.desc}</div>`:""}${tagsHtml?`<div class="card-tags">${tagsHtml}</div>`:""}`;
  return d;
}

function renderMenu(){
  const q=(document.getElementById("searchInput").value||"").toLowerCase().trim();
  const main=document.getElementById("main"); main.innerHTML="";
  if((activeCategory==="all"||activeCategory==="platos")&&!q){
    const pd=document.createElement("div"); pd.className="plato-dia";
    pd.innerHTML=`<div class="label">Menú Ejecutivo</div><h3>🍽️ Plato del Día</h3><p>Consultá a la vendedora por las opciones de hoy</p>`;
    main.appendChild(pd);
  }
  let total=0;
  MENU.categorias.forEach(cat=>{
    if(activeCategory!=="all"&&activeCategory!==cat.id) return;
    const items=(cat.items||[]).filter(it=>{
      if(!q) return true;
      return it.nombre.toLowerCase().includes(q)||(it.desc||"").toLowerCase().includes(q)||(it.tags||[]).some(t=>t.includes(q));
    });
    if(!items.length) return;
    total+=items.length;
    const sec=document.createElement("div"); sec.className="section";
    sec.innerHTML=`<div class="section-title">${cat.nombre}</div>`;
    items.forEach(it=>sec.appendChild(makeCard(it,cat.esCombo)));
    main.appendChild(sec);
  });
  if(!total) main.innerHTML=`<div class="no-results">😕 No encontramos "<strong>${q}</strong>" en la carta.</div>`;
}

buildTabs();
renderMenu();
